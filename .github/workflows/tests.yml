name: Tests
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - name: Check repository paths and resources
        run: python scripts/validation/check_repository.py
      - name: Check application modules, mesh clipping and VERSION
        run: >-
          python -c "import app_version, app_updater, mesh_repair, mesh_diagnostics,
          mesh_full_repair, repair_wizard, viewport_performance, repair_operations,
          repair_manual_geometry, repair_dialog, repair_ribbon, repair_tools, manifold3d, shapely, trimesh,
          placement_geometry, placement_shapes, placement_ribbon, placement_dialog, placement_tools,
          cad_import, cad_geometry, cad_state, cad_supports, cad_dialog, cad_tools, display_ribbon, display_tools, display_statistics, scene_drop;
          from main_window import MainWindow;
          cut, _ = repair_manual_geometry.edit_mesh(trimesh.creation.box(), 'clip',
          dict(point=[0, 0, 0], normal=[0, 0, 1], cap=True));
          assert cut.is_volume and abs(cut.volume - 0.5) < 1e-9;
          print('Application imports OK, version ' + app_version.APP_VERSION)"
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
